name: Offline evaluation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r bridge/requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Analyze synthetic examples
        run: python -m evals.analyze evals/fixtures/sample-venice-surplus.json --compare evals/fixtures/sample-gemini.json
